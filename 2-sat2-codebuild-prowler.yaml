AWSTemplateFormatVersion: 2010-09-09
Description: Self-Service Security Assessment Solutions (v2)

Metadata:
  cfn-lint:
    config:
      ignore_checks:
        # W1030 flags CodeBuildTimeout's MaxValue of 2160 against
        # AWS::CodeBuild::Project TimeoutInMinutes because cfn-lint's bundled
        # resource schema still caps that property at 480 (8 hours), the limit
        # that applied before CodeBuild raised it to 2160 (36 hours) in June
        # 2024. CloudFormation accepts 5-2160, so the parameter range is valid
        # and the finding is a stale-schema false positive.
        #
        # This has to be suppressed at the template level. A resource level
        # ignore_checks on ProwlerCodeBuild has no effect: even though the
        # message names Resources/ProwlerCodeBuild/Properties/TimeoutInMinutes,
        # W1030 anchors the match on the parameter definition
        # (Parameters/CodeBuildTimeout/MaxValue), so a resource scoped ignore
        # never sees it.
        #
        # Remove this once cfn-lint picks up the updated schema.
        - W1030

  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: SATv2 options
        Parameters:
          - ProwlerScanType
          - MultiAccountScan
          - Reporting
          - EmailAddress
      - Label:
          default: Advanced options
        Parameters:
          - ConcurrentAccountScans
          - CodeBuildTimeout
          - MultiAccountListOverride
          - ProwlerOptions
          - ProwlerRole

    ParameterLabels:
      ProwlerOptions:
        default: Prowler options
      ProwlerScanType:
        default: Prowler scan type
      ProwlerRole:
        default: Prowler role
      MultiAccountScan:
        default: Multi-Account scan
      MultiAccountListOverride:
        default: Multi-Account list override
      EmailAddress:
        default: (Optional) Email address
      Reporting:
        default: Reporting
      ConcurrentAccountScans:
        default: Concurrent account scans
      CodeBuildTimeout:
        default: CodeBuild timeout

Parameters:
  ProwlerOptions:
    Description: 'Specify the parameters for Prowler. The --role and ARN will automatically be added to the end of the parameters you specify.'
    Type: String
    Default: aws --ignore-exit-code-3
  ProwlerScanType:
    Description: 'Specify which type of scan to perform. A basic scan runs 13 checks. An Intermediate scan runs all 109+ critical and high checks. A Full scan runs all 383+ checks.'
    Type: String
    AllowedValues:
      - 'Basic'
      - 'Intermediate'
      - 'Full'
    Default: 'Intermediate'
  ProwlerRole:
    Description: 'The role that Prowler should assume to perform the scan.'
    Type: String
    Default: ProwlerMemberRole
  MultiAccountScan:
    Description: 'Set this to true if you want to scan all accounts in your organization. You must have deployed the prerequisite template to provision a role, or specify a different ProwlerRole with the appropriate permissions.'
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'false'
  MultiAccountListOverride:
    Description: 'Specify a space delimited list of accounts to scan. Leaving this blank will scan all accounts in your organization.'
    Type: String
    Default: ''
  EmailAddress:
    Description: 'Specify an address if you want to receive an email when the scan completes.'
    Type: String
    Default: ''
  Reporting:
    Description: 'Set this to true if you want to summarize the reports and use the dashboard. This is helpful when scanning multiple accounts.'
    Type: String
    AllowedValues:
      - 'true'
      - 'false'
    Default: 'true'
  ConcurrentAccountScans:
    Description: 'For multi-account scans, specify the number of accounts to scan concurrently. This is useful for large organizations with many accounts. Selecting more than three may incur additional costs.'
    Type: String
    AllowedValues:
      - 'Three'
      - 'Six'
      - 'Twelve'
      - 'FortyEight'
    Default: 'Three'
  CodeBuildTimeout:
    Description: 'Set the timeout for the CodeBuild job. The default is 300 minutes (5 hours).'
    Type: Number
    MinValue: 5
    MaxValue: 2160
    Default: 300

Conditions:
  CreateProwlerRole: !Equals
    - !Ref MultiAccountScan
    - false

  CreateEmailNotification: !Not [!Equals [!Ref EmailAddress, '']]

  EnableReporting: !Equals
    - !Ref Reporting
    - true

  IsCommercialPartition: !Equals
    - !Ref AWS::Partition
    - aws

Mappings:
  ProwlerScanParameters:
    Basic:
      ProwlerOptions: >
        -c
        account_maintain_current_contact_details
        awslambda_function_using_supported_runtimes
        cloudtrail_multi_region_enabled
        config_recorder_all_regions_enabled
        ec2_securitygroup_allow_ingress_from_internet_to_any_port
        guardduty_is_enabled
        iam_password_policy_lowercase
        iam_password_policy_number
        iam_password_policy_symbol
        iam_password_policy_uppercase
        iam_root_mfa_enabled
        iam_rotate_access_key_90_days
        s3_bucket_public_access
    Intermediate:
      ProwlerOptions: --severity critical high
    Full:
      ProwlerOptions: ''
  CodeBuildPerformanceOptionMap:
    Three:
      ParallelAccounts: 3
      CodeBuildComputeType: BUILD_GENERAL1_SMALL
    Six:
      ParallelAccounts: 6
      CodeBuildComputeType: BUILD_GENERAL1_MEDIUM
    Twelve:
      ParallelAccounts: 12
      CodeBuildComputeType: BUILD_GENERAL1_LARGE
    FortyEight:
      ParallelAccounts: 48
      CodeBuildComputeType: BUILD_GENERAL1_XLARGE

Resources:
  #This is the role that CodeBuild assumes to perform the Prowler scan
  ProwlerIntegrationCodeBuildRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: Role allows * in resource policy. The role needs broad, read-only privileges to review all resources. Only the CodeBuild role created as part of this solution can assume this role.
          - id: W28
            reason: Resource has an explicit name so Prowler can loop through and assume it in each account.
          - id: W76
            reason: SPCM for IAM policy is higher than 25 due to managed polices, and additional polices. Each section of the role has a comment with the Prowler documentation describing the need for the privileges.
    Condition: CreateProwlerRole
    Type: 'AWS::IAM::Role'
    Properties:
      Path: '/service-role/'
      RoleName: ProwlerMemberRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action:
              - 'sts:AssumeRole'
            Condition:
              ArnEquals:
                aws:PrincipalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/service-role/ProwlerCodeBuildRole
      ManagedPolicyArns:
        # Prowler requires these managed polices to perform all the checks
        # https://docs.prowler.cloud/en/latest/getting-started/requirements/
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/SecurityAudit'
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/job-function/ViewOnlyAccess'
      Policies:
        # Prowler requires these additional read-only permissions. They are documented in the Prowler documentation.
        # https://github.com/prowler-cloud/prowler/blob/master/permissions/prowler-additions-policy.json
        - PolicyName: ProwlerAdditions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - account:Get*
                  - amplify:ListApps
                  - amplify:ListBranches
                  - appstream:Describe*
                  - appstream:List*
                  - backup:List*
                  - backup:Get*
                  - bedrock:List*
                  - bedrock:Get*
                  - cloudtrail:GetInsightSelectors
                  - codeartifact:List*
                  - codebuild:BatchGet*
                  - codebuild:ListReportGroups
                  - cognito-idp:GetUserPoolMfaConfig
                  - dlm:Get*
                  - drs:Describe*
                  - ds:Get*
                  - ds:Describe*
                  - ds:List*
                  - dynamodb:GetResourcePolicy
                  - ec2:GetEbsEncryptionByDefault
                  - ec2:GetSnapshotBlockPublicAccessState
                  - ec2:GetInstanceMetadataDefaults
                  - ecr:BatchGetImage
                  - ecr:Describe*
                  - ecr:GetDownloadUrlForLayer
                  - ecr:GetRegistryScanningConfiguration
                  - elasticfilesystem:DescribeBackupPolicy
                  - glue:GetConnections
                  - glue:GetSecurityConfiguration*
                  - glue:SearchTables
                  - glue:GetMLTransforms
                  - lambda:GetFunction*
                  - lambda:GetLayerVersion
                  - lightsail:GetRelationalDatabases
                  - logs:FilterLogEvents
                  - macie2:GetMacieSession
                  - macie2:GetAutomatedDiscoveryConfiguration
                  - s3:GetAccountPublicAccessBlock
                  - shield:DescribeProtection
                  - shield:GetSubscriptionState
                  - securityhub:BatchImportFindings
                  - securityhub:GetFindings
                  - servicecatalog:Describe*
                  - servicecatalog:List*
                  - ssm:DescribeDocumentPermission
                  - ssm:GetDocument
                  - ssm-incidents:List*
                  - states:ListTagsForResource
                  - support:Describe*
                  - tag:GetTagKeys
                  - wellarchitected:List*
                Effect: Allow
                Resource: '*'
              - Action:
                  - apigateway:GET
                Effect: Allow
                Resource:
                  - !Sub arn:${AWS::Partition}:apigateway:*::/restapis/*
                  - !Sub arn:${AWS::Partition}:apigateway:*::/apis/*

  ProwlerFindingsBucket:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: No bucket logging needed.
          - id: W41
            reason: Amazon S3 now applies server-side encryption with Amazon S3 managed keys (SSE-S3) as the base level of encryption for every bucket in Amazon S3.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Type: AWS::S3::Bucket
    Properties:
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: !If [EnableReporting, true, false]
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
  ProwlerFindingsBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Properties:
      Bucket: !Ref ProwlerFindingsBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSSLRequestsOnly
            Principal: '*'
            Action: 's3:*'
            Effect: Deny
            Resource:
              - !Sub '${ProwlerFindingsBucket.Arn}'
              - !Sub '${ProwlerFindingsBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  CodeBuildStartBuild:
    Type: Custom::CodeBuildStartBuild
    Properties:
      ServiceToken: !GetAtt CodeBuildStartBuildLambda.Arn
      ProjectName: !Ref ProwlerCodeBuild

  CodeBuildStartBuildLambdaRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: StartBuildInline
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                Resource: !GetAtt ProwlerCodeBuild.Arn

  CodeBuildStartBuildLogsGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${CodeBuildStartBuildLambda}'
      RetentionInDays: 7

  CodeBuildStartBuildLambda:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: The CodeBuildStartBuildLambdaRole gives Lambda access to write CloudWatch logs.
          - id: W89
            reason: Lambda is not deployed inside of a VPC. The Lambda function is used to start the CodeBuild job as a custom CloudFormation resource.
          - id: W92
            reason: Reserved concurrent executions is not set.
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub ${CodeBuildStartBuildLambdaRole.Arn}
      Timeout: 120
      Runtime: python3.14
      Code:
        ZipFile: |
          import os
          import boto3
          from botocore.exceptions import ClientError
          import cfnresponse

          def startBuild(event, context):
            responseData = {}
            cb = boto3.client('codebuild')
            try:
              print("Starting build...")
              response = cb.start_build(projectName=event['ResourceProperties']['ProjectName'])
              responseData['buildID'] = response['build']['id']
              cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)
            except ClientError as e:
              print("Failed to start build")
              print(e)
              cfnresponse.send(event, context, cfnresponse.FAILED, e.response)

          def no_op(event, context):
            responseData = {}
            cfnresponse.send(event, context, cfnresponse.SUCCESS, responseData)

          def lambda_handler(event,context):
            print(event)
            if event['RequestType'] == 'Create':
              startBuild(event, context)
            else:
              no_op(event,context)

  #This is the role that has privileges to assume Prowler member roles
  ProwlerCodeBuildRole:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W11
            reason: ListAccounts does not support resource types.
          - id: W28
            reason: This role is given an explicit name to further restrict the more permissive ProwlerMemberRole to only be assumed by this role.
    Type: AWS::IAM::Role
    Properties:
      Path: '/service-role/'
      RoleName: ProwlerCodeBuildRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/ProwlerCodeBuild'
      Policies:
        - PolicyName: LogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: UploadtoS3
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - s3:PutObject
                Effect: Allow
                Resource: !Sub '${ProwlerFindingsBucket.Arn}/*'
        - PolicyName: AssumeRole
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - sts:AssumeRole
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:iam::*:role/service-role/ProwlerMemberRole'
        - PolicyName: ListOrganizationAccounts
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - organizations:ListAccounts
                  - organizations:DescribeAccount
                  - organizations:ListTagsForResource
                  # ListParents and DescribeOrganizationalUnit populate the
                  # account_ou_uid and account_ou_name findings columns. Prowler
                  # walks up from the account to the root, reading the name of
                  # every OU on the way, so both actions are needed. Without
                  # them the OU lookup fails silently (Prowler logs a warning
                  # and carries on) and both columns come back empty in Athena
                  # even though the rest of the Organizations data is present.
                  - organizations:ListParents
                  - organizations:DescribeOrganizationalUnit
                Effect: Allow
                Resource: '*'

  ProwlerCodeBuild:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: CodeBuild uses the managed KMS key for S3.
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ProwlerCodeBuild
      Environment:
        ComputeType:
          !FindInMap [
            CodeBuildPerformanceOptionMap,
            !Ref ConcurrentAccountScans,
            'CodeBuildComputeType',
          ]
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        HostKernel:
          !If [IsCommercialPartition, 'LINUX_KERNEL_6', !Ref 'AWS::NoValue']
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: BUCKET_REPORT
            Value: !Ref ProwlerFindingsBucket
            Type: PLAINTEXT
          - Name: PROWLER_OPTIONS
            Value: !Ref 'ProwlerOptions'
            Type: PLAINTEXT
          - Name: PROWLER_SCAN_OPTIONS
            Value:
              !FindInMap [
                ProwlerScanParameters,
                !Ref ProwlerScanType,
                'ProwlerOptions',
              ]
            Type: PLAINTEXT
          - Name: PROWLER_ROLE
            Value: !Ref ProwlerRole
            Type: PLAINTEXT
          - Name: MULTI_ACCOUNT_SCAN
            Value: !Ref MultiAccountScan
            Type: PLAINTEXT
          - Name: MULTI_ACCOUNT_LIST_OVERRIDE
            Value: !Ref MultiAccountListOverride
            Type: PLAINTEXT
          - Name: AWS_PARTITION
            Value: !Sub ${AWS::Partition}
            Type: PLAINTEXT
          - Name: AWS_ACCOUNT_ID
            Value: !Sub ${AWS::AccountId}
            Type: PLAINTEXT
          - Name: PARALLEL_ACCOUNTS
            Value:
              !FindInMap [
                CodeBuildPerformanceOptionMap,
                !Ref ConcurrentAccountScans,
                'ParallelAccounts',
              ]
            Type: PLAINTEXT
      Description: Run Prowler assessment
      ServiceRole: !GetAtt ProwlerCodeBuildRole.Arn
      TimeoutInMinutes: !Ref CodeBuildTimeout
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            install:
              runtime-versions:
                python: 3.12
              commands:
                - echo "Installing Prowler and dependencies..."
                - pip3 install prowler==5.41.0 --quiet
                # Athena reads a Parquet copy of the findings rather than Prowler's CSV.
                # Since Prowler 5.17.0 the check metadata is multi-line markdown, so the
                # DESCRIPTION, RISK and REMEDIATION_* fields contain embedded newlines.
                # Prowler quotes them correctly per RFC4180, but Hive's TextInputFormat
                # splits records on newlines before any SerDe runs, so a CSV-backed table
                # reads one row per physical line instead of one row per finding. Parquet
                # record boundaries are not newlines, so the text survives intact.
                - pip3 install pyarrow==25.0.1 --quiet
                - prowler -v
            build:
              commands:
                - |

                  if [[ $MULTI_ACCOUNT_SCAN = 'true' ]]; then

                      echo "Running multi-account scan."

                      if [[ $MULTI_ACCOUNT_LIST_OVERRIDE != '' ]]; then
                          echo "Using account overrides."
                          account_list=$MULTI_ACCOUNT_LIST_OVERRIDE
                      elif [[ $MULTI_ACCOUNT_LIST_OVERRIDE = '' ]]; then
                          echo "Using accounts from aws organizations."
                          if ! account_list=$(aws organizations list-accounts --query 'Accounts[?Status==`ACTIVE`].Id' --output text); then
                              echo "ERROR: Failed to retrieve account list from AWS Organizations"
                              exit 1
                          fi
                      fi

                      if [[ -z "$account_list" ]]; then
                          echo "ERROR: No accounts found to scan"
                          exit 1
                      fi

                      echo "Using accounts $account_list."

                      failed_accounts=()
                      for accountId in $account_list; do
                          test "$(jobs | wc -l)" -ge $PARALLEL_ACCOUNTS && wait || true
                          {
                              echo "Running Prowler as prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$accountId:role/service-role/$PROWLER_ROLE "
                              prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$accountId:role/service-role/$PROWLER_ROLE -b
                              PROWLER_EXIT_CODE=$?
                              if [ $PROWLER_EXIT_CODE -ne 0 ]; then
                                  echo "ERROR: Prowler scan failed for account $accountId"
                                  failed_accounts+=($accountId)
                                  exit $PROWLER_EXIT_CODE
                              fi
                          } &
                      done

                  elif [[ $MULTI_ACCOUNT_SCAN != 'true' ]]; then

                      echo "Running a single account scan."
                      echo "Running Prowler as prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$AWS_ACCOUNT_ID:role/service-role/$PROWLER_ROLE "
                      prowler $PROWLER_OPTIONS $PROWLER_SCAN_OPTIONS --role arn:$AWS_PARTITION:iam::$AWS_ACCOUNT_ID:role/service-role/$PROWLER_ROLE -b
                      PROWLER_EXIT_CODE=$?
                      if [ $PROWLER_EXIT_CODE -ne 0 ]; then
                          echo "ERROR: Prowler scan failed for account $AWS_ACCOUNT_ID with exit code $PROWLER_EXIT_CODE"
                          exit $PROWLER_EXIT_CODE
                      fi

                  fi

                  wait

                  if [[ ${#failed_accounts[@]} -gt 0 ]]; then
                      echo "WARNING: Prowler scans failed for the following accounts: ${failed_accounts[*]}"
                      echo "Check logs above for specific error details"
                  fi
            post_build:
              commands:
                - echo "CODEBUILD_BUILD_SUCCEEDING status is $CODEBUILD_BUILD_SUCCEEDING "
                # Writes the Parquet copy that the Athena table reads. Prowler's CSV is
                # parsed with a real RFC4180 reader so that fields spanning several
                # physical lines are kept whole, then written to Parquet where the record
                # boundary is not a newline. Every value stays a string except MUTED, so
                # the Glue schema is unchanged apart from the columns Prowler added.
                - |
                  cat > /tmp/prowler_csv_to_parquet.py <<'PROWLER_PARQUET_EOF'
                  import csv
                  import glob
                  import os
                  import sys

                  import pyarrow as pa
                  import pyarrow.parquet as pq

                  # Prowler emits very large single fields (full markdown remediation
                  # snippets), so the default 128 KB field limit is not enough.
                  csv.field_size_limit(min(sys.maxsize, 2**31 - 1))

                  DELIMITER = ";"
                  QUOTECHAR = '"'
                  ROWS_PER_GROUP = 5000
                  BOOL_COLUMNS = {"muted"}
                  TRUE_VALUES = {"true", "1", "yes"}


                  def arrow_type(column):
                      return pa.bool_() if column in BOOL_COLUMNS else pa.string()


                  def cast(column, value):
                      if column not in BOOL_COLUMNS:
                          return value
                      if value is None or value == "":
                          return None
                      return value.strip().lower() in TRUE_VALUES


                  def convert(src, dst):
                      with open(src, newline="", encoding="utf-8") as handle:
                          reader = csv.reader(handle, delimiter=DELIMITER, quotechar=QUOTECHAR)
                          try:
                              header = [name.strip().lower() for name in next(reader)]
                          except StopIteration:
                              return None, 0
                          schema = pa.schema([(name, arrow_type(name)) for name in header])
                          columns = [[] for _ in header]
                          rows = 0
                          ragged = 0
                          writer = pq.ParquetWriter(dst, schema, compression="snappy")
                          try:
                              for row in reader:
                                  if len(row) != len(header):
                                      ragged += 1
                                      row = (row + [""] * len(header))[: len(header)]
                                  for index, name in enumerate(header):
                                      columns[index].append(cast(name, row[index]))
                                  rows += 1
                                  if rows % ROWS_PER_GROUP == 0:
                                      writer.write_table(
                                          pa.Table.from_pydict(
                                              dict(zip(header, columns)), schema=schema
                                          )
                                      )
                                      for column in columns:
                                          del column[:]
                              if columns[0]:
                                  writer.write_table(
                                      pa.Table.from_pydict(
                                          dict(zip(header, columns)), schema=schema
                                      )
                                  )
                          finally:
                              writer.close()
                      if ragged:
                          sys.stderr.write(
                              "WARN %s: %d rows did not match the header width\n"
                              % (os.path.basename(src), ragged)
                          )
                      return header, rows


                  def main():
                      src_dir, dst_dir = sys.argv[1], sys.argv[2]
                      os.makedirs(dst_dir, exist_ok=True)
                      # Non-recursive on purpose: the compliance CSVs live in a
                      # subdirectory and have a completely different schema.
                      sources = sorted(glob.glob(os.path.join(src_dir, "prowler-output-*.csv")))
                      if not sources:
                          sys.stderr.write("ERROR: no Prowler CSV output found in %s\n" % src_dir)
                          return 1
                      total = 0
                      for src in sources:
                          name = os.path.basename(src)[: -len(".csv")] + ".parquet"
                          dst = os.path.join(dst_dir, name)
                          header, rows = convert(src, dst)
                          if header is None:
                              sys.stderr.write("WARN %s is empty, skipped\n" % os.path.basename(src))
                              continue
                          total += rows
                          print("%s: %d findings, %d columns" % (name, rows, len(header)))
                      print("Converted %d file(s) and %d findings to Parquet" % (len(sources), total))
                      return 0


                  if __name__ == "__main__":
                      sys.exit(main())
                  PROWLER_PARQUET_EOF
                - |

                  if [ $CODEBUILD_BUILD_SUCCEEDING -eq 0 ]; then
                      echo "The previous build stage Failed. Exiting the post_build stage without uploading any results to S3 buckets";
                      exit $CODEBUILD_BUILD_SUCCEEDING
                  elif [ $CODEBUILD_BUILD_SUCCEEDING -eq 1 ]; then
                      echo "The build stage succeeded. Now uploading reports to S3 bucket ..."

                      # Every artifact from this run is written under
                      # scan_date=<YYYY-MM-DD>/scan_time=<HHMMSS>. The Athena table is
                      # partitioned on both, so each run is isolated: the reporting query
                      # reads one run and sees a true snapshot. Partitioning on the date
                      # alone is not enough, because a second scan on the same day would
                      # land in the same partition and its findings would be merged with
                      # the earlier run's, leaving stale findings in the results.
                      #
                      # Both values come from a single reading of the build start time, so
                      # a scan that runs across UTC midnight cannot be split in two and the
                      # date and time can never disagree.
                      if [ -n "$CODEBUILD_START_TIME" ]; then
                          SCAN_STAMP=$(date -u -d "@$((CODEBUILD_START_TIME / 1000))" +%Y-%m-%dT%H%M%S 2>/dev/null || date -u +%Y-%m-%dT%H%M%S)
                      else
                          SCAN_STAMP=$(date -u +%Y-%m-%dT%H%M%S)
                      fi
                      SCAN_DATE=${SCAN_STAMP%T*}
                      SCAN_TIME=${SCAN_STAMP#*T}
                      PARTITION="scan_date=$SCAN_DATE/scan_time=$SCAN_TIME"
                      echo "Writing this run to partition $PARTITION"

                      upload_failed=false

                      echo "Converting CSV findings to Parquet for Athena..."
                      if ! python3 /tmp/prowler_csv_to_parquet.py output output-parquet; then
                          echo "ERROR: Failed to convert Prowler CSV output to Parquet"
                          upload_failed=true
                      fi

                      echo "Uploading Parquet findings..."
                      if ! aws s3 cp --exclude "*" --include "*.parquet" output-parquet/ s3://$BUCKET_REPORT/parquet/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload Parquet findings"
                          upload_failed=true
                      fi

                      echo "Uploading CSV reports..."
                      if ! aws s3 cp --exclude "*" --include "*.csv" --exclude "compliance**" output/ s3://$BUCKET_REPORT/csv/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload CSV reports"
                          upload_failed=true
                      fi

                      # Not every scan type produces compliance output. Without this
                      # guard the copy fails on a missing directory, the phase exits 1,
                      # and because the reporting rule only fires on a SUCCEEDED build
                      # the whole summary step would be skipped.
                      echo "Uploading compliance CSV reports..."
                      if [ -d output/compliance ]; then
                          if ! aws s3 cp --exclude "*" --include "*.csv" output/compliance/ s3://$BUCKET_REPORT/compliance/$PARTITION/ --recursive; then
                              echo "ERROR: Failed to upload compliance CSV reports"
                              upload_failed=true
                          fi
                      else
                          echo "This scan produced no compliance output; nothing to upload."
                      fi

                      echo "Uploading OCSF JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.ocsf.json" output/ s3://$BUCKET_REPORT/ocsf-json/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload OCSF JSON reports"
                          upload_failed=true
                      fi

                      echo "Uploading JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.json" --exclude "*.ocsf.json" --exclude "*.asff.json" output/ s3://$BUCKET_REPORT/json/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload JSON reports"
                          upload_failed=true
                      fi

                      echo "Uploading HTML reports..."
                      if ! aws s3 cp --exclude "*" --include "*.html" output/ s3://$BUCKET_REPORT/html/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload HTML reports"
                          upload_failed=true
                      fi

                      echo "Uploading ASFF JSON reports..."
                      if ! aws s3 cp --exclude "*" --include "*.asff.json" output/ s3://$BUCKET_REPORT/asff-json/$PARTITION/ --recursive; then
                          echo "ERROR: Failed to upload ASFF JSON reports"
                          upload_failed=true
                      fi

                      if [[ $upload_failed == true ]]; then
                          echo "ERROR: One or more S3 uploads failed. Check logs above for details."
                          exit 1
                      fi

                      echo "All reports uploaded successfully!"
                  fi

  ProwlerLogGroup:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/codebuild/${ProwlerCodeBuild}'
      RetentionInDays: 7

  ProwlerScanNotificationTopic:
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W47
            reason: Topic is used to send notification that the scan is done. Topic does not use AWS KMS CMK or default key. If SNS uses the default AWS KMS key alias/aws/sns, then EventBridge can't publish messages to the SNS topic. The default KMS key policy for SNS doesn't allow EventBridge kms:decrypt and kms:GenerateDataKey.
    Condition: CreateEmailNotification
    Type: AWS::SNS::Topic
    Properties:
      Subscription:
        - Endpoint: !Ref EmailAddress
          Protocol: email

  ProwlerSnsNotificationsPolicy:
    Condition: CreateEmailNotification
    Type: AWS::SNS::TopicPolicy
    Properties:
      PolicyDocument:
        Id: snsNotificationsPolicy
        Version: '2012-10-17'
        Statement:
          - Sid: Allow events
            Effect: Allow
            Principal:
              Service: 'events.amazonaws.com'
            Action:
              - sns:Publish
            Resource: !Ref ProwlerScanNotificationTopic
      Topics:
        - !Ref ProwlerScanNotificationTopic

  CodeBuildStateChangeRule:
    Condition: CreateEmailNotification
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
            - FAILED
            - STOPPED
          project-name:
            - !Ref ProwlerCodeBuild
      State: ENABLED
      Targets:
        - Id: toSNS
          Arn: !Ref ProwlerScanNotificationTopic
          InputTransformer:
            InputPathsMap:
              build-status: $.detail.build-status
              bucket: $.detail.additional-information.environment.environment-variables[0].value
            InputTemplate: >-
              "The Prowler scan has <build-status>."

              "You can view your results in the <bucket> bucket."

  GlueDatabaseSATv2Findings:
    Condition: EnableReporting
    Type: AWS::Glue::Database
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseInput:
        Name: !Ref ProwlerFindingsBucket
        Description: !Sub 'SATv2 assessment results in the ${ProwlerFindingsBucket}'

  GlueTableProwlerResults:
    Condition: EnableReporting
    Type: AWS::Glue::Table
    Properties:
      CatalogId: !Ref AWS::AccountId
      DatabaseName: !Ref GlueDatabaseSATv2Findings
      TableInput:
        Name: 'prowler'
        Description: 'Results of the Prowler scan from SATv2, partitioned by scan date'
        TableType: EXTERNAL_TABLE
        Parameters: { 'classification': 'parquet' }
        # One partition per scan run, keyed on the date and the time the run
        # started. Partitioning on the date alone would merge two scans from the
        # same day, so the newest results would be mixed with the previous run's
        # and findings that no longer exist would linger in the report.
        # Keeping the date as its own key means a whole day can still be queried
        # with an equality filter, which lets Athena prune partitions.
        # New partitions are registered by the MSCK REPAIR TABLE that
        # AthenaStartQueryLambda runs before the consolidation query.
        PartitionKeys:
          - Name: scan_date
            Type: string
          - Name: scan_time
            Type: string
        StorageDescriptor:
          Columns:
            - Name: auth_method
              Type: string
            - Name: timestamp
              Type: string
            - Name: account_uid
              Type: string
            - Name: account_name
              Type: string
            - Name: account_email
              Type: string
            - Name: account_organization_uid
              Type: string
            - Name: account_organization_name
              Type: string
            - Name: account_tags
              Type: string
            - Name: finding_uid
              Type: string
            - Name: provider
              Type: string
            - Name: check_id
              Type: string
            - Name: check_title
              Type: string
            - Name: check_type
              Type: string
            - Name: status
              Type: string
            - Name: status_extended
              Type: string
            - Name: muted
              Type: boolean
            - Name: service_name
              Type: string
            - Name: subservice_name
              Type: string
            - Name: severity
              Type: string
            - Name: resource_type
              Type: string
            - Name: resource_uid
              Type: string
            - Name: resource_name
              Type: string
            - Name: resource_details
              Type: string
            - Name: resource_tags
              Type: string
            - Name: partition
              Type: string
            - Name: region
              Type: string
            - Name: description
              Type: string
            - Name: risk
              Type: string
            - Name: related_url
              Type: string
            - Name: remediation_recommendation_text
              Type: string
            - Name: remediation_recommendation_url
              Type: string
            - Name: remediation_code_nativeiac
              Type: string
            - Name: remediation_code_terraform
              Type: string
            - Name: remediation_code_cli
              Type: string
            - Name: remediation_code_other
              Type: string
            - Name: compliance
              Type: string
            - Name: categories
              Type: string
            - Name: depends_on
              Type: string
            - Name: related_to
              Type: string
            - Name: notes
              Type: string
            - Name: prowler_version
              Type: string
            # Columns added by Prowler 5.20.0.
            - Name: additional_urls
              Type: string
            - Name: account_ou_uid
              Type: string
            - Name: account_ou_name
              Type: string
          Location: !Sub s3://${ProwlerFindingsBucket}/parquet
          InputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetInputFormat
          OutputFormat: org.apache.hadoop.hive.ql.io.parquet.MapredParquetOutputFormat
          Compressed: False
          StoredAsSubDirectories: False
          SerdeInfo:
            SerializationLibrary: org.apache.hadoop.hive.ql.io.parquet.serde.ParquetHiveSerDe
            Parameters: { 'serialization.format': '1' }
        Retention: 0

  LakeFormationPermissionsLambda:
    Condition: EnableReporting
    Type: AWS::LakeFormation::Permissions
    Properties:
      DataLakePrincipal:
        DataLakePrincipalIdentifier: !Sub ${AthenaStartQueryLambdaRole.Arn}
      Permissions:
        # ALTER is required so the Lambda can register the scan_date partition of
        # the current run via MSCK REPAIR TABLE before it queries the results.
        - SELECT
        - ALTER
      Resource:
        TableResource:
          DatabaseName: !Ref GlueDatabaseSATv2Findings
          Name: !Ref GlueTableProwlerResults

  SATv2Reporting:
    Condition: EnableReporting
    Type: AWS::Athena::WorkGroup
    Properties:
      Name: !Ref GlueDatabaseSATv2Findings
      RecursiveDeleteOption: True
      State: ENABLED
      WorkGroupConfiguration:
        PublishCloudWatchMetricsEnabled: false
        RequesterPaysEnabled: false
        ResultConfiguration:
          OutputLocation: !Sub s3://${ProwlerFindingsBucket}/athena_results
        EnforceWorkGroupConfiguration: false

  qProwlerOrgSummary:
    Condition: EnableReporting
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseSATv2Findings
      Description: 'Count the number of recommendations across all assessed accounts'
      Name: 'Prowler organization summary'
      QueryString: !Sub |
        -- Count the number of recommendations across all assessed accounts.
        -- The table holds one partition per scan run, keyed on scan_date and
        -- scan_time. Restricting to the newest run matters: without it the query
        -- totals every scan ever run, and filtering on the date alone would still
        -- merge two runs from the same day.
          SELECT
              check_id,
              count(*) as count
          FROM
              "${GlueDatabaseSATv2Findings}"."prowler"
          WHERE
              status = 'FAIL'
              AND concat(scan_date, scan_time) = (
                  SELECT max(concat(scan_date, scan_time))
                  FROM "${GlueDatabaseSATv2Findings}"."prowler"
              )
          GROUP BY
              check_id
          ORDER BY
              count desc
      WorkGroup: !Ref SATv2Reporting

  qProwlerScanTrend:
    Condition: EnableReporting
    Type: AWS::Athena::NamedQuery
    Properties:
      Database: !Ref GlueDatabaseSATv2Findings
      Description: 'Compare failed checks between scans to see whether posture is improving'
      Name: 'Prowler scan trend'
      QueryString: !Sub |
        -- Compare failed checks across every scan retained in the bucket.
        -- One row per scan run per severity. Grouping on scan_time as well as
        -- scan_date keeps two runs from the same day as separate rows instead of
        -- adding them together.
          SELECT
              scan_date,
              scan_time,
              severity,
              count(*) as failed_checks,
              count(distinct account_uid) as accounts
          FROM
              "${GlueDatabaseSATv2Findings}"."prowler"
          WHERE
              status = 'FAIL'
          GROUP BY
              scan_date,
              scan_time,
              severity
          ORDER BY
              scan_date desc,
              scan_time desc,
              failed_checks desc
      WorkGroup: !Ref SATv2Reporting

  AthenaStartQueryLambdaRole:
    Condition: EnableReporting
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AccessToAthena
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'athena:StartQueryExecution'
                  # Required to poll MSCK REPAIR TABLE to completion before the
                  # consolidation query runs. Without it the Lambda cannot see
                  # whether the partition was registered.
                  - 'athena:GetQueryExecution'
                Resource: !Sub arn:${AWS::Partition}:athena:${AWS::Region}:${AWS::AccountId}:workgroup/${SATv2Reporting}
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt ProwlerFindingsBucket.Arn
                  - !Sub ${ProwlerFindingsBucket.Arn}/*
              - Effect: Allow
                Action:
                  - 'glue:GetTable'
                  - 'glue:GetDatabase'
                  # MSCK REPAIR TABLE registers the scan_date partition written by
                  # the CodeBuild run before the consolidation query reads it.
                  - 'glue:GetPartition'
                  - 'glue:GetPartitions'
                  - 'glue:CreatePartition'
                  - 'glue:BatchCreatePartition'
                Resource:
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:catalog
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:database/${GlueDatabaseSATv2Findings}
                  - !Sub arn:${AWS::Partition}:glue:${AWS::Region}:${AWS::AccountId}:table/${GlueDatabaseSATv2Findings}/${GlueTableProwlerResults}

  AthenaStartQueryLogGroup:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AthenaStartQueryLambda}'
      RetentionInDays: 7

  AthenaStartQueryLambda:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: The AthenaStartQueryLambdaRole gives Lambda access to write CloudWatch logs.
          - id: W89
            reason: Lambda is not deployed inside of a VPC. The Lambda function is used to start the CodeBuild job as a custom CloudFormation resource.
          - id: W92
            reason: Reserved concurrent executions is not set.
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub ${AthenaStartQueryLambdaRole.Arn}
      Timeout: 120
      Environment:
        Variables:
          ATHENA_WORKGROUP: !Ref SATv2Reporting
          BUCKET_REPORT: !Ref ProwlerFindingsBucket
          GLUE_DATABASE: !Ref GlueDatabaseSATv2Findings
          GLUE_TABLE: !Ref GlueTableProwlerResults
      Runtime: python3.14
      Code:
        ZipFile: |
          import os
          import time

          import boto3
          from botocore.exceptions import ClientError

          S3_BUCKET = os.environ['BUCKET_REPORT']
          WORKGROUP = os.environ['ATHENA_WORKGROUP']
          DATABASE = os.environ['GLUE_DATABASE']
          TABLE = os.environ['GLUE_TABLE']

          # Columns that never contain newlines, copied through unchanged.
          PLAIN_COLUMNS = [
              'scan_date', 'scan_time', '"timestamp"', 'account_uid', 'account_name',
              'account_ou_uid', 'account_ou_name', 'region', 'service_name',
              'check_id', 'check_title', 'status', 'status_extended', 'severity',
              'muted', 'resource_type', 'resource_uid', 'resource_name',
              'related_url', 'remediation_recommendation_url',
              'categories', 'prowler_version', 'finding_uid',
          ]

          # Prowler 5.17.0 and later put multi-line markdown in these fields. The
          # Parquet table keeps the original text so Athena queries see it in full,
          # but the consolidated CSV is read by satv2-dashboard.html, whose parser
          # splits on newlines and discards any row whose field count does not match
          # the header. Collapsing the newlines here keeps the dashboard working
          # without degrading what is stored in the table.
          MULTILINE_COLUMNS = [
              'description',
              'risk',
              'remediation_recommendation_text',
          ]

          # Deliberately absent from the consolidated CSV, because the dashboard
          # reads none of them and they dominate its size:
          #   remediation_code_*  roughly doubles the file
          #   compliance          about 29% of it on a multi-account scan
          # Both remain in the Parquet table, so Athena queries still see them.
          # Compliance framework mappings are available there and in the
          # per-account files under the compliance/ prefix.


          def qualified_table():
              return '"AwsDataCatalog"."{}"."{}"'.format(DATABASE, TABLE)


          def build_consolidation_query():
              """The most recent run only, one row per finding, no newlines.

              The run is identified by scan_date + scan_time rather than the date,
              so a second scan on the same day replaces the earlier one in the
              report instead of being merged with it. Both keys are fixed width and
              zero padded, so comparing them as one concatenated string orders runs
              chronologically.

              The finding_uid de-duplication is a safety net. Each run has its own
              partition, so duplicates should not arise; this keeps the report
              correct even if two runs somehow share a partition.
              """
              columns = list(PLAIN_COLUMNS)
              for column in MULTILINE_COLUMNS:
                  columns.append(
                      "regexp_replace({0}, '[\\r\\n]+', ' ') AS {0}".format(column)
                  )
              return (
                  'WITH latest AS ('
                  ' SELECT max(concat(scan_date, scan_time)) AS run_key FROM {table}'
                  '), deduped AS ('
                  ' SELECT p.*, row_number() OVER ('
                  ' PARTITION BY p.finding_uid ORDER BY p."timestamp" DESC'
                  ' ) AS sat_row'
                  ' FROM {table} AS p'
                  ' JOIN latest ON concat(p.scan_date, p.scan_time) = latest.run_key'
                  ') SELECT {columns} FROM deduped WHERE sat_row = 1'
              ).format(table=qualified_table(), columns=', '.join(columns))


          def run_and_wait(athena, query, label, timeout=90):
              """Run a query to completion. Results land in athena_results/ so that
              they do not trip the reports/*.csv rule that builds the dashboard."""
              try:
                  response = athena.start_query_execution(
                      QueryString=query,
                      QueryExecutionContext={'Database': DATABASE},
                      WorkGroup=WORKGROUP,
                      ResultConfiguration={
                          'OutputLocation': 's3://{}/athena_results'.format(S3_BUCKET)
                      },
                  )
              except ClientError as error:
                  print('{}: failed to start: {}'.format(label, error))
                  return False
              execution_id = response['QueryExecutionId']
              print('{}: started {}'.format(label, execution_id))
              deadline = time.time() + timeout
              while time.time() < deadline:
                  try:
                      execution = athena.get_query_execution(
                          QueryExecutionId=execution_id
                      )['QueryExecution']
                  except ClientError as error:
                      # A polling failure must not abort the run. The partition may
                      # well have been registered anyway, and the consolidation
                      # query is far more important than confirming this step.
                      print('{}: cannot check status: {}'.format(label, error))
                      return False
                  state = execution['Status']['State']
                  if state in ('SUCCEEDED', 'FAILED', 'CANCELLED'):
                      print('{}: {}'.format(label, state))
                      if state != 'SUCCEEDED':
                          print(execution['Status'].get('StateChangeReason', ''))
                      return state == 'SUCCEEDED'
                  time.sleep(2)
              print('{}: timed out waiting for completion'.format(label))
              return False


          def describe_trigger(event):
              """Summarise the event for the log. The raw CodeBuild state change
              embeds the entire buildspec, which buries anything useful."""
              if not isinstance(event, dict):
                  return {'event': repr(event)[:200]}
              detail = event.get('detail') or {}
              return {
                  'source': event.get('source'),
                  'project-name': detail.get('project-name'),
                  'build-status': detail.get('build-status'),
                  'build-id': detail.get('build-id'),
              }


          def lambda_handler(event, context):
              print(describe_trigger(event))
              athena = boto3.client('athena')
              # Register the scan_date partition the CodeBuild run just uploaded.
              # Without this the consolidation query cannot see the new results.
              if not run_and_wait(
                  athena,
                  'MSCK REPAIR TABLE `{}`'.format(TABLE),
                  'MSCK REPAIR TABLE',
              ):
                  print('Partition repair did not succeed; querying anyway.')
              try:
                  print('Starting consolidation query...')
                  response = athena.start_query_execution(
                      QueryString=build_consolidation_query(),
                      WorkGroup=WORKGROUP,
                      ResultConfiguration={
                          'OutputLocation': 's3://{}/reports'.format(S3_BUCKET)
                      },
                  )
                  print('Consolidation query started: {}'.format(
                      response['QueryExecutionId']
                  ))
              except ClientError as error:
                  print("Failed to start query")
                  print(error)

  AthenaStartQueryLambdaInvokePermission:
    Condition: EnableReporting
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt AthenaStartQueryLambda.Arn
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt CodeBuildCompleteRunSummary.Arn

  CodeBuildCompleteRunSummary:
    Condition: EnableReporting
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
          project-name:
            - !Ref ProwlerCodeBuild
      State: ENABLED
      Targets:
        - Id: AthenaStartQueryLambda
          Arn: !GetAtt AthenaStartQueryLambda.Arn

  AthenaSummaryQueryStateChangeRule:
    Condition: CreateEmailNotification
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.athena
        detail-type:
          - Athena Query State Change
        detail:
          currentState:
            - SUCCEEDED
            - FAILED
          # The Lambda runs MSCK REPAIR TABLE (DDL) before the consolidation query
          # (DML). Matching only DML keeps this to one notification per scan.
          statementType:
            - DML
          workgroupName:
            - !Ref ProwlerFindingsBucket
      State: ENABLED
      Targets:
        - Id: toSNS
          Arn: !Ref ProwlerScanNotificationTopic
          InputTransformer:
            InputPathsMap:
              status: $.detail.currentState
            InputTemplate: !Sub >-
              "The query to summarize reporting has <status>."

              "You can view your results in the ${ProwlerFindingsBucket}/reports bucket."

  # PPTX reporting
  ProwlerReportingLambdaRole:
    Condition: EnableReporting
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
            Condition:
              StringEquals:
                aws:SourceAccount: !Sub ${AWS::AccountId}
      Path: /
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: AccessToS3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt ProwlerFindingsBucket.Arn
                  - !Sub ${ProwlerFindingsBucket.Arn}/*
        - PolicyName: AccessToCodeBuild
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - 'codebuild:StartBuild'
                Resource: !GetAtt ProwlerReportingCodeBuild.Arn

  ProwlerReportingLogGroup:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W84
            reason: CloudWatch Logs protects data at rest using encryption. All log groups are encrypted. By default, the CloudWatch Logs service manages the server-side encryption keys.
    UpdateReplacePolicy: Delete
    DeletionPolicy: Delete
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProwlerReportingLambda}'
      RetentionInDays: 7

  ProwlerReportingLambda:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W58
            reason: The ProwlerReportingLambdaRole gives Lambda access to write CloudWatch logs.
          - id: W89
            reason: Lambda is not deployed inside of a VPC.
          - id: W92
            reason: Reserved concurrent executions is not set.
    Type: AWS::Lambda::Function
    Properties:
      Handler: index.lambda_handler
      Role: !Sub ${ProwlerReportingLambdaRole.Arn}
      Timeout: 120
      Runtime: python3.14
      Code:
        ZipFile: |
          import boto3
          from botocore.exceptions import ClientError

          def startCodeBuildReport(event, context):
              print(event)

              bucket = event['detail']['bucket']['name']
              key = event['detail']['object']['key']
              full_path = f"s3://{bucket}/{key}"
              print(f"Summary CSV from Athena: {full_path}")

              cb = boto3.client('codebuild')
              try:
                print("Starting build...")
                response = cb.start_build(projectName='ProwlerReportingCodeBuild', \
                environmentVariablesOverride=[])
                print(response)
              except ClientError as e:
                print("Failed to start build")
                print(e)

          def lambda_handler(event,context):
              startCodeBuildReport(event, context)

  ProwlerReportingLambdaInvokePermission:
    Condition: EnableReporting
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt ProwlerReportingLambda.Arn
      Action: 'lambda:InvokeFunction'
      Principal: 'events.amazonaws.com'
      SourceArn: !GetAtt ProwlerReportingS3Upload.Arn

  ProwlerReportingS3Upload:
    Condition: EnableReporting
    Type: AWS::Events::Rule
    Properties:
      EventBusName: default
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref ProwlerFindingsBucket
          object:
            key:
              - wildcard: reports/*.csv
      State: ENABLED
      Targets:
        - Id: toLambda
          Arn: !GetAtt ProwlerReportingLambda.Arn

  ProwlerReportingCodeBuildRole:
    Condition: EnableReporting
    Type: AWS::IAM::Role
    Properties:
      Path: '/service-role/'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 'sts:AssumeRole'
            Effect: Allow
            Principal:
              Service:
                - codebuild.amazonaws.com
            Condition:
              StringEquals:
                aws:SourceArn: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/ProwlerReportingCodeBuild'
      Policies:
        - PolicyName: LogGroup
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Effect: Allow
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/*'
        - PolicyName: AccessToS3
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:ListBucketMultipartUploads
                  - s3:AbortMultipartUpload
                  - s3:PutObject
                  - s3:ListMultipartUploadParts
                Resource:
                  - !GetAtt ProwlerFindingsBucket.Arn
                  - !Sub ${ProwlerFindingsBucket.Arn}/*

  ProwlerReportingCodeBuild:
    Condition: EnableReporting
    Metadata:
      cfn_nag:
        rules_to_suppress:
          - id: W32
            reason: CodeBuild uses the managed KMS key for S3.
    Type: AWS::CodeBuild::Project
    Properties:
      Name: ProwlerReportingCodeBuild
      Environment:
        ComputeType: 'BUILD_GENERAL1_SMALL'
        Image: 'aws/codebuild/amazonlinux2-x86_64-standard:5.0'
        HostKernel:
          !If [IsCommercialPartition, 'LINUX_KERNEL_6', !Ref 'AWS::NoValue']
        Type: 'LINUX_CONTAINER'
        EnvironmentVariables:
          - Name: BUCKET_REPORT
            Value: !Ref ProwlerFindingsBucket
            Type: PLAINTEXT
      Description: Create Prowler report
      ServiceRole: !GetAtt ProwlerReportingCodeBuildRole.Arn
      TimeoutInMinutes: 60
      Artifacts:
        Type: NO_ARTIFACTS
      Source:
        Type: NO_SOURCE
        BuildSpec: |
          version: 0.2
          phases:
            build:
              commands:
                - echo "Downloading repo..."
                - git clone https://github.com/awslabs/aws-security-assessment-solution.git
                - cd aws-security-assessment-solution/reporting
                - echo "Uploading html dashboard to S3..."
                - aws s3 cp satv2-dashboard.html s3://$BUCKET_REPORT/reports/
                - echo "Done!"

Outputs:
  AccountID:
    Description: ID that Prowler is running from
    Value: !GetAtt ProwlerCodeBuildRole.Arn
